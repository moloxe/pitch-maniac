<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" fill="none">
  <defs>
    <linearGradient id="brandTextGrad" x1="0" y1="0" x2="300" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="markGrad" x1="8" y1="64" x2="64" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="iconBg" x1="0" y1="0" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Logomark Icon Box -->
  <rect x="4" y="4" width="72" height="72" rx="18" fill="url(#iconBg)"/>
  <rect x="5" y="5" width="70" height="70" rx="17" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Note Bars inside Mark -->
  <rect x="14" y="46" width="14" height="6" rx="3" fill="#38bdf8" opacity="0.6"/>
  <rect x="44" y="24" width="22" height="6" rx="3" fill="#10b981" opacity="0.9"/>

  <!-- Pitch Wave Curve -->
  <path
    d="M 14 49 C 24 49, 26 27, 36 27 C 46 27, 48 27, 66 27"
    stroke="url(#markGrad)"
    stroke-width="3.5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Active Mic Cursor -->
  <circle cx="36" cy="27" r="7" fill="#10b981" opacity="0.25"/>
  <circle cx="36" cy="27" r="4.5" fill="#10b981" stroke="#f0fdf4" stroke-width="1.8"/>

  <!-- Typography: Pitch Maniac -->
  <text x="94" y="44" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5" fill="url(#brandTextGrad)">
    Pitch Maniac
  </text>
  <text x="95" y="63" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#38bdf8" text-transform="uppercase" opacity="0.9">
    Karaoke Vocal Studio
  </text>
</svg>

