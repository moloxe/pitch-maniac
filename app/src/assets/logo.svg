<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="16" y1="96" x2="112" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Rounded Background -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Horizontal Pitch Staff Lines -->
  <line x1="16" y1="36" x2="112" y2="36" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="16" y1="64" x2="112" y2="64" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="16" y1="92" x2="112" y2="92" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Target Pitch Note Bars (Flowing Right to Left) -->
  <rect x="20" y="74" width="22" height="10" rx="5" fill="#38bdf8" opacity="0.45"/>
  <rect x="74" y="42" width="32" height="10" rx="5" fill="#10b981" opacity="0.85"/>
  <rect x="86" y="78" width="22" height="10" rx="5" fill="#06b6d4" opacity="0.5"/>

  <!-- Dynamic Vocal Pitch Waveform / Curve -->
  <path
    d="M 18 79 C 34 79, 36 47, 52 47 C 64 47, 66 47, 104 47"
    stroke="url(#accentGrad)"
    stroke-width="6"
    stroke-linecap="round"
    fill="none"
    filter="url(#glow)"
  />

  <!-- Center Vertical Playhead Line -->
  <line x1="52" y1="22" x2="52" y2="106" stroke="#f8fafc" stroke-width="2" opacity="0.35"/>

  <!-- Active Singer Pitch Cursor (Glowing Emerald Orb) -->
  <circle cx="52" cy="47" r="11" fill="#10b981" opacity="0.25"/>
  <circle cx="52" cy="47" r="7" fill="#10b981" stroke="#ecfdf5" stroke-width="2.5"/>

  <!-- Stylized Mic / Sound Crest Accent on Left -->
  <rect x="24" y="30" width="8" height="16" rx="4" fill="#38bdf8" opacity="0.9"/>
  <path d="M 20 40 C 20 48, 36 48, 36 40" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.9"/>
  <line x1="28" y1="46" x2="28" y2="52" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
</svg>

